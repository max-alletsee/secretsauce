events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name secretsauce.food www.secretsauce.food;

        # TLS — certs mounted from ./certs/ in docker-compose.yml
        ssl_certificate /etc/nginx/certs/cert.pem;
        ssl_certificate_key /etc/nginx/certs/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # Backend API
        location /api/ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend static files.
        # Hashed asset filenames are immutable — cache them forever. A missing
        # hash must 404 rather than fall back to index.html, which would serve
        # HTML where the browser expects a JS module (blank screen).
        location /assets/ {
            root /usr/share/nginx/html;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
            # index.html is the deploy entry point — always revalidate so a
            # new deploy (new asset hashes) is picked up immediately
            add_header Cache-Control "no-cache";
        }
    }
}
